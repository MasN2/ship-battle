<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Ship Battle: Tactical</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="style.additional.css" />
    <link rel="stylesheet" href="perfhack.css" />
    <link rel="stylesheet" href="summary-bar.css" />
</head>

<body>
    <div class="container">
        <div class="app" id="app">
            <div class="hud-top">
                <div class="turn-info" id="turn-info" data-tip="turn">TURN 1 · DEPLOY</div>
            </div>
            <button class="btn-action danger" id="btn-restart-top">↻ Restart Battle</button>
            <button class="hud-menu-btn" id="menu-btn" title="Open Menu (ESC)">
                <span>⚙ Menu</span>
                <kbd>ESC</kbd>
            </button>

            <div class="battlefield" id="battlefield">
                <div id="fx-layer"></div>
            </div>


            <!-- Modal Overlay & Form Container -->
            <div class="modal-overlay" id="formModal">
                <div class="modal-content">
                    <h2>Import Game</h2>
                    <div class="form-group">
                        <label for="userSelect">Select a Scenario:</label>
                        <select id="userSelect">
                            <option value="">-- Clear --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="handicapSelect">Select a Handicap:</label>
                        <select id="handicapSelect">
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                        </select>
                    </div>
                    <form id="popupForm">
                        <div class="form-group" style="display:flex">
                            <label for="name">Blue Build Order:</label>
                            <input type="text" id="blue-bo" name="name" style="flex-grow:1">
                        </div>
                        <div class="form-group" style="display:flex">
                            <label for="email">Red Build Order:</label>
                            <input type="text" id="red-bo" name="email" style="flex-grow:1">
                        </div>
                        <button type="submit" id="importBtn">Import</button>
                    </form>
                </div>
            </div>

            <div class="deploy-bar shortcut-bar" id="shortcut-bar"></div>
        </div>
        <div class="bottom-bar">

            <div class="stats-row">
                <div class="stat-card blue">
                    <div class="left">
                        <div class="faction">◤ Blue Command</div>
                        <input type="text" oninput="window.setUsername(this.value)" value="player">
                    </div>
                    <div class="stat-resources">
                        <div data-tip="money"><span class="stat-label">Money</span><span class="stat-val"
                                id="blue-money">0.00</span></div>
                        <div data-tip="ore"><span class="stat-label">Ore</span><span class="stat-val"
                                id="blue-ore">2.00</span></div>
                    </div>
                </div>
                <input type="text" id="command-line" value="">
                <div class="stat-card red">
                    <div class="left">
                        <div class="faction">Red Command ◥</div>
                        <div class="commander" id="red-command">Opponent · CPU</div>
                    </div>
                    <div class="stat-resources">
                        <div data-tip="money"><span class="stat-label">Money</span><span class="stat-val"
                                id="red-money">0.00</span></div>
                        <div data-tip="ore"><span class="stat-label">Ore</span><span class="stat-val"
                                id="red-ore">2.00</span></div>
                    </div>
                </div>
            </div>
            <div class="deploy-bar" id="deploy-bar"></div>
        </div>
    </div>
    <div id="tooltip" role="tooltip"></div>


    <div class="pause-overlay" id="pause-modal" aria-hidden="true">
        <div class="pause-dialog">
            <div class="pause-header">
                <h2>Pause Menu</h2>
                <span class="esc-hint">Press <kbd>ESC</kbd> to resume</span>
            </div>

            <div class="pause-section-title">Settings</div>
            <div class="pause-grid">
                <div class="pause-field">
                    <label for="handicap-select">AI Mode</label>
                    <select id="handicap-select">
                        <!-- Options will be populated via JavaScript -->
                    </select>
                </div>

                <div class="pause-field">
                    <label>Animation Speed (<span id="speed-val">1×</span>)</label>
                    <input type="range" id="speed-slider" min="0.5" max="15" step="0.5" value="1" />
                </div>

                <label for="sound-toggle">
                    <div class="pause-field toggle-row">
                        <label for="sound-toggle">Enable SFX</label>
                        <input type="checkbox" id="sound-toggle" />
                    </div>
                </label>

                <label for="tag-toggle">
                    <div class="pause-field toggle-row">
                        <label for="tag-toggle">Advanced UI</label>
                        <input type="checkbox" id="tag-toggle" />
                    </div>
                </label>

                <label for="shortcut-toggle">
                    <div class="pause-field toggle-row">
                        <label for="shortcut-toggle">Fast Buy Bar</label>
                        <input type="checkbox" id="shortcut-toggle" />
                    </div>
                </label>
            </div>
            <!--
            <div class="pause-footer">
                <button class="btn-action outline" id="btn-open-scenarios">📂 Load Scenarios / Import</button>
            </div>
            -->
            <div class="pause-actions">
                <button class="btn-action primary" id="btn-resume">▶ Resume Battle</button>
                <button class="btn-action danger" id="btn-restart">↻ Restart Battle</button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
    <script type="module" src="script.pause.js"></script>
    <script type="module" src="summary-bar.js"></script>
    <script>
        state = (await import('./js/state.js')).state;
        shipCost = (await import('./js/economy.js')).shipCost;
    </script>
    <!--<script defer src="https://static.itch.io/htmlgame.js" type="text/javascript"></script>-->
</body>

</html>
